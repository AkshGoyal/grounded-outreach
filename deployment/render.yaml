# Real backend, separate from the root sample-only render.yaml.
# Review Render's paid service/disk pricing before applying this blueprint.
services:
  - type: web
    name: outreach-workspace
    runtime: python
    branch: codex/research-pilot-v1
    plan: starter
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: uv sync --locked --no-dev --python 3.12
    startCommand: .venv/bin/python -m outreach.hosted
    healthCheckPath: /health
    disk:
      name: outreach-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OUTREACH_HOSTED_DATA_DIR
        value: /var/data/outreach
      - key: OUTREACH_APP_PASSWORD
        generateValue: true
      - key: OUTREACH_LLM_PROVIDER
        value: openrouter
      - key: OUTREACH_LLM_MODEL
        value: openai/gpt-5.6-luna
      - key: OUTREACH_RESEARCH_MODEL
        value: anthropic/claude-haiku-4.5
      - key: OUTREACH_RESEARCH_MAX_BUDGET_USD
        value: "1"
      - key: OUTREACH_RESEARCH_DAILY_BUDGET_USD
        value: "1"
      - key: OUTREACH_DAILY_SEND_CAP
        value: "10"
      - key: OUTREACH_SEND_GAP_SECONDS
        value: "60"
