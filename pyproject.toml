[project]
name = "outreach-agent"
version = "0.1.0"
description = "Personalized B2B outreach: grounded drafting, controlled sending, reply classification and follow-ups."
requires-python = ">=3.11"
dependencies = [
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.2",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "openai>=1.40",
    "cryptography>=43",
    "httpx>=0.27",
]

[project.scripts]
outreach = "outreach.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
# Third-party deprecation notices from starlette's test client. Not our code,
# and not actionable here — listed explicitly rather than hidden wholesale.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["outreach"]
