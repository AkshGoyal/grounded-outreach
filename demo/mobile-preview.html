<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Outreach · Mobile workflow demo</title>
<style>
:root{font-family:system-ui,sans-serif;color:#19313b;background:#f4f8f8;--green:#17786c;--muted:#5e7680;--line:#d7e4e5}*{box-sizing:border-box}body{margin:0}header{background:#123337;color:white;padding:18px 20px;display:flex;align-items:center;justify-content:space-between}header strong{font-size:20px}header span{font-size:12px}.notice{padding:12px 20px;background:#e7f4ed;color:#245944;font-size:13px;line-height:1.5}main{max-width:900px;margin:auto;padding:24px 18px 112px}h1{font-size:29px;line-height:1.15;margin:8px 0 16px;letter-spacing:-.6px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.55}.eyebrow{color:var(--green);font-size:11px;letter-spacing:1.6px;font-weight:750}.muted{color:var(--muted);font-size:13px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button,input,textarea,select{font:inherit}button{border:1px solid var(--green);background:var(--green);color:white;border-radius:7px;padding:12px 16px;font-size:13px;font-weight:650;cursor:pointer;min-height:44px}button.secondary{background:white;color:var(--green);border-color:var(--line)}button:disabled{opacity:.5;cursor:default}label{display:block;font-size:13px;font-weight:650;margin:12px 0}input:not([type=checkbox]),textarea,select{display:block;width:100%;padding:12px;border:1px solid #b9cdd0;border-radius:6px;background:white;color:#19313b;margin-top:7px}textarea{min-height:120px;resize:vertical}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:8px;accent-color:var(--green)}.badge{font-size:11px;border-radius:4px;background:#e7f1ef;color:var(--green);padding:4px 7px;display:inline-block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}.cards .panel{margin:0}.steps{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0;color:var(--muted);font-size:12px}.steps strong{color:var(--green)}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 4px max(8px,env(safe-area-inset-bottom));z-index:5}nav button{padding:12px 6px;min-width:0;flex:1;max-width:130px;border:0;background:white;color:var(--muted);font-size:11px}nav button.active{background:#e7f4ed;color:var(--green)}.success{padding:14px;border-radius:8px;background:#e7f4ed;color:#245944;margin:15px 0;line-height:1.5}.error{background:#fff0df;color:#845108;padding:14px;border-radius:8px}.counts{display:flex;gap:12px;margin:20px 0}.counts div{background:white;border:1px solid var(--line);border-radius:8px;padding:14px;flex:1;font-size:12px;color:var(--muted)}.counts strong{display:block;font-size:25px;color:#19313b}details{font-size:13px;line-height:1.6;margin:12px 0}summary{cursor:pointer;color:var(--green)}.email{overflow-wrap:anywhere}.footer{margin-top:25px;border-top:1px solid var(--line);padding-top:16px;font-size:12px;color:var(--muted)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #83c6b9;outline-offset:2px}
</style>
</head>
<body>
<header><strong>O&nbsp; Outreach</strong><span>Phone preview</span></header>
<div class="notice"><strong>Interactive demo.</strong> Sample companies and mailboxes. Research and sending are simulated. No API calls or email deliveries.</div>
<main id="app"></main><nav id="nav" aria-label="Workspace navigation"></nav>
<script>
'use strict';
const samples=[{id:1,name:'Sample Textile Mills',city:'Tiruppur',email:'purchasing@textile-mills.example',fit:'Textile manufacturing; business contact published in sample evidence.'},{id:2,name:'Sample Knitwear Company',city:'Ludhiana',email:'hello@knitwear.example',fit:'Knitwear production; business contact published in sample evidence.'},{id:3,name:'Sample Cotton Works',city:'Coimbatore',email:'sales@cotton-works.example',fit:'Cotton products; business contact published in sample evidence.'}];
const initial=()=>({brief:'',criteria:'Companies that match my audience, with a published business email.',stage:'brief',selected:[],lists:[],campaigns:[{id:1,name:'Textile outreach',sender:'Sample Gmail',topic:'Introduce our cotton thread supply',drafts:[],status:'Draft'},{id:2,name:'Career outreach',sender:'Sample Zoho',topic:'Introduce my interest in AI product roles',drafts:[],status:'Draft'}],replies:[]});
let state=initial();try{const saved=JSON.parse(localStorage.getItem('outreach-mobile-demo-v1'));if(saved&&Array.isArray(saved.campaigns)&&Array.isArray(saved.lists)&&Array.isArray(saved.selected)&&Array.isArray(saved.replies))state=saved}catch{}
let screen='overview',activeCampaign=null,flash='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>{try{localStorage.setItem('outreach-mobile-demo-v1',JSON.stringify(state))}catch{}};
const button=(label,action,secondary=false)=>`<button type="button" class="${secondary?'secondary':''}" data-action="${esc(action)}">${esc(label)}</button>`;
const workflow=()=>`<div class="steps"><strong>1 Brief</strong><span>2 Approve plan</span><span>3 Review leads</span><span>4 Run campaign</span></div>`;
const briefForm=()=>`<section class="panel"><label>Tell us who you want to reach<textarea id="brief" maxlength="8000" placeholder="Find textile manufacturers in India with a published business email.">${esc(state.brief)}</textarea></label><div class="row"><label>Purpose<select id="purpose"><option>Sales</option><option>Job search</option><option>Partnerships</option></select></label><label>Sample company target<input value="3" readonly aria-label="Three sample companies"></label></div><p class="muted">Your brief stays on this device. This demo creates a sample plan locally, without AI or research charges.</p>${button('Create sample research plan','plan')}</section>`;
function render(){
 let html='';
 if(screen==='overview')html=`<p class="eyebrow">YOUR OUTREACH WORKSPACE</p><h1>Turn an idea into a conversation.</h1><p class="muted">Find your audience, review leads, and choose a campaign and sending account.</p>${briefForm()}<div class="counts"><div><strong>${state.campaigns.length}</strong>campaigns</div><div><strong>${state.lists.length}</strong>lead lists</div><div><strong>${state.campaigns.reduce((n,c)=>n+c.drafts.filter(d=>d.sent).length,0)}</strong>simulated sends</div></div><div class="cards">${campaignCards()}</div>`;
 if(screen==='research'){
  html=`<p class="eyebrow">START WITH AN IDEA</p><h1>Who would you like to reach?</h1>${workflow()}`;
  if(state.stage==='brief')html+=briefForm();
  if(state.stage==='plan')html+=`<section class="panel"><span class="badge">Waiting for your approval</span><h2 style="margin-top:16px">Review the research plan</h2><label>What we understood<textarea id="brief" maxlength="8000">${esc(state.brief)}</textarea></label><label>Required criteria<textarea id="criteria" maxlength="4000">${esc(state.criteria)}</textarea></label><p class="muted">Live research would use your approved criteria. This demo will show three fixed sample companies, regardless of your brief.</p><label><input id="confirm-plan" type="checkbox">I approve this sample plan.</label><div class="actions">${button('Approve plan & show sample leads','research')}${button('Back to brief','restart-research',true)}</div></section>`;
  if(state.stage==='leads')html+=`<h2>Review the sample companies</h2><p class="muted">These are fictional fixtures, not results researched for your brief. Select or remove companies before approving.</p>${samples.map(l=>`<section class="panel"><label><input type="checkbox" data-lead="${l.id}" ${state.selected.includes(l.id)?'checked':''}>${esc(l.name)}</label><p class="muted">${esc(l.city)}</p><p class="email">${esc(l.email)}</p><details><summary>View sample evidence</summary>${esc(l.fit)}<p>This is fictional evidence. A live lead needs source and contact ownership checks.</p></details></section>`).join('')}<section class="panel"><label><input id="confirm-leads" type="checkbox">I approve my selected sample leads.</label>${button('Approve selection & choose campaign','approve-leads')}</section>`;
  if(state.stage==='approved')html+=`<div class="success">${state.selected.length} sample leads approved. Save them to a list and choose a campaign.</div>${enrollment()}`;
 }
 if(screen==='lists')html=`<p class="eyebrow">YOUR AUDIENCE</p><h1>Lead lists</h1>${state.lists.length?state.lists.map((l,i)=>`<section class="panel"><h2>${esc(l.name)}</h2><p class="muted">${l.ids.length} approved sample companies</p>${button('Add these leads to a campaign','list:'+i)}</section>`).join(''):`<section class="panel"><p>Approve sample leads in Research to save your first list.</p>${button('Start research','go:research')}</section>`}`;
 if(screen==='campaigns'){
  const c=state.campaigns.find(c=>c.id===activeCampaign);
  html=`<p class="eyebrow">RUN OUTREACH</p><h1>${c?esc(c.name):'All campaigns'}</h1>`;
  if(!c)html+=`<p class="muted">Each campaign chooses its own sending account and topic. Open one to review drafts or add leads.</p><div class="cards">${campaignCards()}</div>`;
  else html+=`<section class="panel"><p><span class="badge">${esc(c.status)}</span></p><label>Sample sending account<select id="sender" ${c.drafts.some(d=>d.sent)?'disabled':''}><option ${c.sender==='Sample Gmail'?'selected':''}>Sample Gmail</option><option ${c.sender==='Sample Zoho'?'selected':''}>Sample Zoho</option></select></label><label>What should the emails be about?<textarea id="topic" maxlength="4000">${esc(c.topic)}</textarea></label><div class="actions">${button('Save topic','save-topic')}${button('Add more sample leads','add-leads',true)}${button('All campaigns','all-campaigns',true)}</div><p class="muted">Editing the topic resets approval on unsent drafts.</p></section>${c.drafts.length?c.drafts.map((d,i)=>`<section class="panel"><h3>${esc(d.name)}</h3><p class="email muted">${esc(d.email)}</p><span class="badge">${d.sent?'Sent · simulation':d.approved?'Approved':'Needs review'}</span><label>Subject<input data-subject="${i}" maxlength="500" value="${esc(d.subject)}" ${d.sent?'readonly':''}></label><label>Email<textarea data-body="${i}" maxlength="8000" ${d.sent?'readonly':''}>${esc(d.body)}</textarea></label>${d.sent?'':button(d.approved?'Remove approval':'Approve this draft','draft:'+i,d.approved)}</section>`).join('')+`<section class="panel"><p class="muted">${c.drafts.filter(d=>d.approved&&!d.sent).length} approved sample drafts ready.</p>${button('Review simulated sending','send-preview')}</section>`:`<section class="panel"><p>No sample leads yet. Approve a selection in Research, then add it here.</p>${button('Find sample leads','add-leads')}</section>`}`;
 }
 if(screen==='send'){
  const c=state.campaigns.find(c=>c.id===activeCampaign),ready=c?.drafts.filter(d=>d.approved&&!d.sent)||[];
  html=`<p class="eyebrow">FINAL REVIEW</p><h1>Simulate sending</h1><section class="panel"><h2>${esc(c?.name)}</h2><p>From: ${esc(c?.sender)} · sample account</p><p>${ready.length} approved sample emails</p><p class="muted">This only updates the demo on your device. No account is connected and no email will be sent.</p>${ready.map(d=>`<details><summary>${esc(d.email)}</summary><strong>${esc(d.subject)}</strong><p>${esc(d.body)}</p></details>`).join('')}<label><input id="confirm-send" type="checkbox">I approve this simulated send.</label><div class="actions">${button('Simulate sending approved drafts','send')}${button('Back to campaign','go:campaigns',true)}</div></section>`;
 }
 if(screen==='inbox')html=`<p class="eyebrow">MANAGE CONVERSATIONS</p><h1>Inbox</h1><p class="muted">Sample replies appear after a simulated send. No real inbox is accessed.</p>${state.replies.length?state.replies.map((r,i)=>`<section class="panel"><span class="badge">${r.done?'Reply simulated':'Interested · sample'}</span><h2 style="margin-top:12px">${esc(r.company)}</h2><p class="muted">${esc(r.campaign)} · ${esc(r.sender)}</p><p>Thanks for reaching out. Could you share a product catalogue and sample details?</p><label>Your sample reply<textarea data-reply="${i}" maxlength="8000">${esc(r.answer||'Thank you for your interest. I can share our product catalogue and discuss the samples you need.')}</textarea></label>${button('Simulate reply','reply:'+i)}</section>`).join(''):'<section class="panel"><p>There are no sample replies yet. Review a campaign, approve its drafts and simulate sending.</p>'+button('Browse campaigns','go:campaigns')+'</section>'}`;
 if(screen==='accounts')html=`<p class="eyebrow">SENDING IDENTITIES</p><h1>Email accounts</h1><p class="muted">Try choosing different sample accounts for different campaigns.</p>${['Gmail','Zoho'].map(provider=>`<section class="panel"><h2>Sample ${provider}</h2><span class="badge">Demo identity only</span><p>No mailbox is connected. The live app currently uses app passwords; provider OAuth is planned.</p></section>`).join('')}<section class="panel"><h2>About this preview</h2><p>Your changes are stored only in this browser when device storage is available. They do not update the Cloud project. Do not enter passwords or API keys.</p>${button('Reset all sample data','reset',true)}</section>`;
 document.querySelector('#app').innerHTML=(flash?`<div class="success" role="status">${esc(flash)}</div>`:'')+html+'<p class="footer">Workflow demo based on the Outreach campaign workspace. Sample data only; no network requests.</p>';
 document.querySelector('#nav').innerHTML=[['overview','Home'],['research','Research'],['lists','Lists'],['campaigns','Campaigns'],['inbox','Inbox'],['accounts','Accounts']].map(([id,label])=>`<button type="button" class="${screen===id?'active':''}" data-action="go:${id}" ${screen===id?'aria-current="page"':''}>${label}</button>`).join('');
 flash='';
}
function campaignCards(){return state.campaigns.map(c=>`<section class="panel"><span class="badge">${esc(c.status)}</span><h2 style="margin-top:12px">${esc(c.name)}</h2><p class="muted">${esc(c.sender)} · ${c.drafts.length} sample leads</p><p>${esc(c.topic)}</p>${button('Open campaign','campaign:'+c.id)}</section>`).join('')}
function enrollment(){return `<section class="panel"><label>Save selection as a lead list<input id="list-name" maxlength="120" value="Reviewed sample companies"></label><label>Campaign<select id="campaign-choice"><option value="new">Create a new campaign</option>${state.campaigns.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>New campaign name<input id="campaign-name" maxlength="120" value="My sample campaign"></label><label>New campaign topic<textarea id="new-topic" maxlength="4000">Introduce our business and ask whether they would like samples.</textarea></label><label>Sample sending account<select id="new-sender"><option>Sample Gmail</option><option>Sample Zoho</option></select></label>${button('Save list & open campaign','enroll')}</section>`}
function notify(message){flash=message;render()}
function go(destination){screen=destination;render();window.scrollTo(0,0)}
document.addEventListener('click',event=>{
 const a=event.target.closest('[data-action]')?.dataset.action;if(!a)return;
 const c=state.campaigns.find(c=>c.id===activeCampaign);
 if(a.startsWith('go:')){if(a==='go:campaigns'&&screen!=='send')activeCampaign=null;go(a.slice(3));return}
 if(a==='plan'){const brief=document.querySelector('#brief').value.trim();if(brief.length<10){notify('Describe your audience in at least 10 characters.');return}state.brief=brief;state.stage='plan';go('research')}
 else if(a==='restart-research'){state.stage='brief';go('research')}
 else if(a==='research'){if(!document.querySelector('#confirm-plan').checked){notify('Confirm your plan before continuing.');return}state.brief=document.querySelector('#brief').value.trim();state.criteria=document.querySelector('#criteria').value.trim();state.stage='leads';state.selected=samples.map(l=>l.id);go('research')}
 else if(a==='approve-leads'){if(!state.selected.length){notify('Select at least one sample company.');return}if(!document.querySelector('#confirm-leads').checked){notify('Confirm your selected leads before continuing.');return}state.stage='approved';go('research')}
 else if(a==='enroll'){let id=document.querySelector('#campaign-choice').value;const listName=document.querySelector('#list-name').value.trim();if(!listName||!state.selected.length){notify('Provide a list name and select sample leads.');return}if(id==='new'){const name=document.querySelector('#campaign-name').value.trim(),topic=document.querySelector('#new-topic').value.trim();if(!name||!topic){notify('Give the campaign a name and topic.');return}id=Math.max(0,...state.campaigns.map(c=>c.id))+1;state.campaigns.push({id,name,topic,sender:document.querySelector('#new-sender').value,drafts:[],status:'Draft'})}const campaign=state.campaigns.find(c=>c.id===Number(id));state.lists.push({name:listName,ids:[...state.selected]});for(const lead of samples.filter(l=>state.selected.includes(l.id)))if(!campaign.drafts.some(d=>d.email===lead.email))campaign.drafts.push({...lead,subject:'A quick introduction',body:`Hello ${lead.name},\n\n${campaign.topic}\n\nWould you be open to a short conversation?\n\nDemo Sender`,approved:false,sent:false});activeCampaign=campaign.id;flash='Sample list saved. Review and approve each draft.';go('campaigns')}
 else if(a.startsWith('list:')){state.selected=[...state.lists[Number(a.slice(5))].ids];state.stage='approved';go('research')}
 else if(a.startsWith('campaign:')){activeCampaign=Number(a.slice(9));go('campaigns')}
 else if(a==='all-campaigns'){activeCampaign=null;go('campaigns')}
 else if(a==='add-leads'){state.stage='leads';state.selected=[];go('research')}
 else if(a==='save-topic'){const topic=document.querySelector('#topic').value.trim();if(!topic){notify('Add a campaign topic.');return}const sender=document.querySelector('#sender').value;if(topic!==c.topic||sender!==c.sender){c.topic=topic;c.sender=sender;for(const d of c.drafts)if(!d.sent)d.approved=false}notify('Campaign settings saved. Unsent drafts need review after changes.')}
 else if(a.startsWith('draft:')){const d=c.drafts[Number(a.slice(6))];if(!d.sent)d.approved=!d.approved;render()}
 else if(a==='send-preview'){if(!c.drafts.some(d=>d.approved&&!d.sent)){notify('Approve a sample draft first.');return}go('send')}
 else if(a==='send'){if(!document.querySelector('#confirm-send').checked){notify('Confirm the simulated send first.');return}for(const d of c.drafts)if(d.approved&&!d.sent){d.sent=true;state.replies.push({company:d.name,campaign:c.name,sender:c.sender,done:false})}c.status='Active · demo';flash='Simulated sending complete. Sample replies are now in Inbox.';go('campaigns')}
 else if(a.startsWith('reply:')){const r=state.replies[Number(a.slice(6))];r.answer=document.querySelector(`[data-reply="${Number(a.slice(6))}"]`).value;r.done=true;notify('Reply simulated. No email was sent.')}
 else if(a==='reset'){if(confirm('Reset all sample data on this device?')){state=initial();activeCampaign=null;go('overview')}}
 persist();
});
document.addEventListener('input',event=>{const el=event.target;if(el.id==='brief')state.brief=el.value;if(el.id==='criteria')state.criteria=el.value;for(const key of ['subject','body'])if(el.dataset[key]!==undefined){const c=state.campaigns.find(c=>c.id===activeCampaign),d=c.drafts[Number(el.dataset[key])];if(!d.sent){d[key]=el.value;d.approved=false;const panel=el.closest('.panel');panel.querySelector('.badge').textContent='Needs review';panel.querySelector('[data-action^="draft:"]').textContent='Approve this draft'}}if(el.dataset.lead!==undefined){const id=Number(el.dataset.lead);state.selected=el.checked?[...new Set([...state.selected,id])]:state.selected.filter(x=>x!==id)}persist()});
render();
</script>
</body>
</html>
